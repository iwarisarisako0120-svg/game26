<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>スマホ版・シマエナガ観察たたき</title>
    <style>
        :root {
            --sky-top: #b3e5fc;
            --sky-bottom: #e1f5fe;
            --grass-light: #c5e1a5;
            --grass-dark: #689f38;
            --bird-white: #ffffff;
            --blush: #ffcdd2;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 40%, var(--grass-light) 40%, var(--grass-dark) 100%);
            font-family: 'Hiragino Sans', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #ui { 
            text-align: center; 
            margin-bottom: 3vh; 
            z-index: 10; 
            width: 90%;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid var(--grass-dark);
        }

        .score { font-size: 24px; font-weight: bold; color: #5d4037; margin: 0; }
        .timer { font-size: 16px; color: #d32f2f; font-weight: bold; margin-top: 2px; }

        #game-grid {
            display: grid;
            grid-template-columns: repeat(3, 29vw);
            grid-template-rows: repeat(3, 29vw);
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 25px;
            max-width: 380px;
            max-height: 380px;
        }

        .hole {
            background-color: #4e342e;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 6px 10px rgba(0,0,0,0.5);
        }

        /* 表情がしっかり見えるスマホ最大サイズのシマエナガ */
        .shimaenaga {
            width: 90%;
            height: 90%;
            background-color: var(--bird-white);
            border-radius: 50% 50% 48% 48%;
            position: absolute;
            bottom: -100%;
            left: 5%;
            transition: bottom 0.12s cubic-bezier(0.17, 0.89, 0.32, 1.3);
            box-shadow: 0 0 15px 5px white;
            animation: idle-bob 2.5s infinite ease-in-out;
        }

        @keyframes idle-bob {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(2deg) scale(1.02, 0.98); }
        }

        /* 顔：スマホでもはっきり見えるようパーツ比率を調整 */
        .eyes { position: absolute; top: 36%; width: 100%; display: flex; justify-content: center; gap: 28%; }
        .eye { width: 10%; height: 12%; background: #222; border-radius: 50%; position: relative; }
        .eye::after {
            content: '';
            position: absolute;
            top: 15%; left: 15%;
            width: 40%; height: 40%;
            background: white; border-radius: 50%;
        }

        .beak {
            position: absolute; top: 49%; left: 50%; transform: translateX(-50%);
            width: 12%; height: 9%; background: #333;
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
        }

        .blush { position: absolute; top: 54%; width: 100%; display: flex; justify-content: center; gap: 50%; }
        .cheek { width: 18%; height: 8%; background: var(--blush); border-radius: 50%; opacity: 0.8; }

        .shimaenaga.up { bottom: 8%; }

        /* 叩かれた時の演出：表情は変えず、一瞬縮んでから消える */
        .shimaenaga.hit {
            transform: scale(0.85);
        }

        #start-btn {
            margin-top: 4vh;
            padding: 12px 40px;
            font-size: 20px;
            background: #ff7043;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px #d84315;
            cursor: pointer;
        }

        .rush-text {
            position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 36px; color: #d32f2f; font-weight: bold;
            opacity: 0; z-index: 100; text-shadow: 2px 2px 0 white;
            pointer-events: none;
        }

        .show-rush { animation: rush-anim 1s forwards; }
        @keyframes rush-anim {
            0% { opacity: 0; scale: 0.5; }
            50% { opacity: 1; scale: 1.2; }
            100% { opacity: 0; scale: 1.5; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="score-box">
            <p class="score">スコア: <span id="score">0</span></p>
            <p class="timer" id="timer-label">のこり: <span id="time">30</span>びょう</p>
        </div>
        <button id="start-btn">スタート！</button>
    </div>

    <div id="game-grid">
        <script>
            for(let i=0; i<9; i++) {
                document.write(`
                    <div class="hole">
                        <div class="shimaenaga">
                            <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                            <div class="beak"></div>
                            <div class="blush"><div class="cheek"></div><div class="cheek"></div></div>
                        </div>
                    </div>
                `);
            }
        </script>
    </div>

    <div id="rush-label" class="rush-text">ラストスパート！！</div>

    <script>
        const birds = document.querySelectorAll('.shimaenaga');
        const scoreBoard = document.querySelector('#score');
        const timeBoard = document.querySelector('#time');
        const startBtn = document.querySelector('#start-btn');
        const rushLabel = document.querySelector('#rush-label');
        
        let lastHole, timeUp = false, score = 0, countdown, isRush = false;

        function randomTime(min, max) { return Math.round(Math.random() * (max - min) + min); }

        function randomHole() {
            const idx = Math.floor(Math.random() * birds.length);
            const hole = birds[idx];
            if (hole === lastHole) return randomHole();
            lastHole = hole;
            return hole;
        }

        function peep() {
            const time = isRush ? randomTime(350, 650) : randomTime(650, 1000);
            const bird = randomHole();
            bird.classList.add('up');

            setTimeout(() => {
                bird.classList.remove('up');
                if (!timeUp) peep();
            }, time);

            if (isRush && Math.random() > 0.5) {
                setTimeout(() => {
                    if (!timeUp) {
                        const extra = randomHole();
                        extra.classList.add('up');
                        setTimeout(() => extra.classList.remove('up'), time);
                    }
                }, 200);
            }
        }

        function startGame() {
            score = 0;
            scoreBoard.textContent = 0;
            timeUp = false;
            isRush = false;
            startBtn.style.visibility = 'hidden';
            
            let timeLeft = 30;
            timeBoard.textContent = timeLeft;

            peep();

            countdown = setInterval(() => {
                timeLeft--;
                timeBoard.textContent = timeLeft;

                if (timeLeft === 10) {
                    isRush = true;
                    rushLabel.classList.add('show-rush');
                    setTimeout(() => rushLabel.classList.remove('show-rush'), 1000);
                }

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timeUp = true;
                    alert('おしまい！\nスコア：' + score + '点');
                    startBtn.style.visibility = 'visible';
                }
            }, 1000);
        }

        function bonk(e) {
            e.preventDefault();
            if(!this.classList.contains('up') || this.classList.contains('hit')) return;
            
            score++;
            scoreBoard.textContent = score;
            this.classList.add('hit');
            
            setTimeout(() => {
                this.classList.remove('up');
                setTimeout(() => this.classList.remove('hit'), 100);
            }, 60);
        }

        birds.forEach(bird => {
            bird.addEventListener('touchstart', bonk);
            bird.addEventListener('mousedown', bonk);
        });

        startBtn.addEventListener('click', startGame);

        // スクロールなどの無効化
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>
